name: Anthropic federation check

# Verifies that GitHub's OIDC token can be exchanged for Anthropic API
# credentials via workload identity federation (no long-lived API key),
# using plain curl against the /v1/oauth/token and /v1/messages endpoints.
#
# Required repository variables (Settings > Secrets and variables > Actions):
#   ANTHROPIC_FEDERATION_RULE_ID, ANTHROPIC_ORGANIZATION_ID,
#   ANTHROPIC_SERVICE_ACCOUNT_ID
# Optional:
#   ANTHROPIC_WORKSPACE_ID   (required only if the rule spans several workspaces)
#   ANTHROPIC_OIDC_AUDIENCE  (must match the audience on the federation issuer)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # lets the job request a GitHub OIDC token

jobs:
  hello:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: ${{ runner.temp }}/anthropic-oidc-token
    steps:
      - name: Fetch GitHub OIDC token
        env:
          AUDIENCE: ${{ vars.ANTHROPIC_OIDC_AUDIENCE || 'https://api.anthropic.com' }}
        run: |
          token=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE" | jq -r .value)
          echo "::add-mask::$token"
          umask 077
          printf '%s' "$token" > "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      - name: Exchange OIDC token for an Anthropic access token
        run: |
          body=$(jq -n \
            --rawfile jwt "$ANTHROPIC_IDENTITY_TOKEN_FILE" \
            --arg rule "$ANTHROPIC_FEDERATION_RULE_ID" \
            --arg org "$ANTHROPIC_ORGANIZATION_ID" \
            --arg sa "$ANTHROPIC_SERVICE_ACCOUNT_ID" \
            --arg ws "$ANTHROPIC_WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $jwt,
              federation_rule_id: $rule,
              organization_id: $org,
              service_account_id: $sa}
             + (if $ws != "" then {workspace_id: $ws} else {} end)')
          access_token=$(curl -sS -X POST https://api.anthropic.com/v1/oauth/token \
            -H "content-type: application/json" -d "$body" | jq -er .access_token)
          echo "::add-mask::$access_token"
          echo "ACCESS_TOKEN=$access_token" >> "$GITHUB_ENV"

      - name: Call Claude
        run: |
          curl -sS --max-time 600 https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $ACCESS_TOKEN" \
            -H "anthropic-version: 2023-06-01" \
            -H "content-type: application/json" \
            -d '{
              "model": "claude-sonnet-5-5",
              "max_tokens": 16000,
              "thinking": {"type": "adaptive"},
              "output_config": {"effort": "high"},
              "messages": [{"role": "user", "content": "Hello, Claude"}]
            }' | jq -r '.content[] | select(.type == "text") | .text'
